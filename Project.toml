name = "NABACHD"
uuid = "2f4be160-e832-4691-8b8c-2d630f836d61"
authors = ["Ewan Smith <ewanwsmith@googlemail.com>"]
version = "0.1.0"

# The core module loads only these. `src/plots.jl` is a standalone module
# (NeighbourhoodPlots) that is not included by NABACHD.jl, so its dependencies
# are declared as weak: they are not installed with the package. To build
# figures, add them yourself and `include("src/plots.jl")`.
[deps]
CSV = "336ed68f-0bac-5ca0-87d4-7b16caf5d00b"
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"

[weakdeps]
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
ColorSchemes = "35d6a980-a343-548e-a6ea-1d62b119f2f4"
KernelDensity = "5ab0869b-81aa-558d-bb23-cbf5423bbe9b"
MultivariateStats = "6f286f6a-111f-5878-ab1e-185364afe411"
UMAP = "c4f8c510-2410-5be4-91d7-4fbaeb39457e"

[extensions]
NABACHDPlotsExt = ["CairoMakie", "ColorSchemes", "KernelDensity", "MultivariateStats", "UMAP"]

[compat]
CSV = "0.10"
CairoMakie = "0.15"
ColorSchemes = "3"
DataFrames = "1"
KernelDensity = "0.6"
LinearAlgebra = "1"
MultivariateStats = "0.10"
Random = "1"
Statistics = "1"
UMAP = "0.3"
julia = "1.10"

[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test"]
